name: CI

on:
  push:
    branches: [main, other]
  pull_request:
    branches: [main, other]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-app:
    name: Expo App (Lint & Typecheck)
    runs-on: ubuntu-latest

    env:
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_placeholder_for_ci' }}
      EXPO_PUBLIC_STREAM_API_KEY: ${{ secrets.EXPO_PUBLIC_STREAM_API_KEY || 'placeholder_stream_key' }}
      EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST || 'https://us.i.posthog.com' }}
      EXPO_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.EXPO_PUBLIC_POSTHOG_PROJECT_TOKEN || 'phc_placeholder' }}
      CI: true

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 🔍 Run ESLint
        run: npm run lint

      - name: 🛡️ Run TypeScript Typecheck
        run: npx tsc --noEmit

  vision-agent:
    name: Vision Agent (Python Backend Check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision-agent

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f pyproject.toml ]; then pip install . || true; fi

      - name: 🔍 Python Syntax & Compilation Check
        run: |
          python -m compileall src/
